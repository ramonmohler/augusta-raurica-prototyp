    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(DATA)));
    // erst nach dem vollständigen Laden ersetzen, sonst hängt document.write den Inhalt nur an
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    document.open(); document.write(html); document.close();
  };
  const saved = (() => { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } })();
  if (saved) {   // schon entsperrt: Formular nicht aufblitzen lassen
    document.documentElement.style.visibility = 'hidden';
    show(u8(saved)).catch(() => { document.documentElement.style.visibility = ''; try { sessionStorage.removeItem(KEY); } catch (e) {} });
  }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err'); err.textContent = '';
    const pw = document.getElementById('pw').value;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
      await show(raw);
      try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (x) { err.textContent = 'Das Passwort stimmt nicht. Bitte nochmals versuchen.'; }
  });
})();
</script>
</body>
</html>
