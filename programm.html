    const pw = document.getElementById('pw').value;
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
      const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
      await show(raw);
      try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (x) { err.textContent = 'Das Passwort stimmt nicht. Bitte nochmals versuchen.'; }
  });
})();
</script>
